{% extends 'dictionary/base.html' %}
{% load static %}

{% block title %}Chaghatay Dictionary{% endblock %}

{% block content %}
<h1 class="home-header">The Chaghatay Dictionary Project</h1>
<div class="search-container">
    <input type="text" id="search-box" autocomplete="off" placeholder="Search...">
    <div class="search-mode-toggle">
        <label><input type="radio" name="search-mode" value="chag_to_eng" checked> Chaghatay → English</label>
        <label><input type="radio" name="search-mode" value="eng_to_chag"> English → Chaghatay</label>
    </div>
    <div id="suggestions"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'dictionary/search.js' %}"></script>
{% endblock %}
